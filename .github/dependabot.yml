version: 2

# Schedules here govern *version updates* only -- the routine "a newer release
# exists" pull requests.
#
# Security alerts are deliberately not on this schedule and cannot be put on
# one. They fire whenever a new advisory matches something in go.sum, which is
# what you want: holding a known vulnerability until Friday to keep the inbox
# tidy would be the wrong trade.

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Grouped so a coordinated OpenTelemetry release arrives as one
      # reviewable pull request instead of eight that must be merged together.
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "docker"
