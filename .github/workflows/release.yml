name: Release

on:
  push:
    tags: ["v*"]

# Least privilege at the top: the verify job needs only to read the code. The
# write permissions belong to the release job alone and are declared there, so
# a compromised step in verify cannot create a release or mint an attestation.
permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  IMAGE: dougeubanks/solarham

jobs:
  # A tag must never publish something that would have failed CI. The tag build
  # does not inherit the branch build's result, so the checks run again here
  # rather than being assumed.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          # latest is applied by the flavor below, not here. The obvious
          # incantation, type=raw,value=latest,enable={{is_default_branch}},
          # is silently dead on a tag push: a tag is not a branch, so
          # is_default_branch evaluates false and latest never moves.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # latest=auto moves latest for any semver tag that is not a
          # pre-release, so v1.0.0 moves it and v1.1.0-rc1 does not.
          flavor: |
            latest=auto

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The Docker Hub page is the first thing anyone pulling this sees, and it
      # is easy to forget it exists because nothing in the build fails when it
      # is empty. Syncing it on every release means it cannot drift away from
      # the code it describes.
      - name: Sync the Docker Hub description
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Space weather and HF propagation exporter for Prometheus, InfluxDB, MQTT and OTLP"
          readme-filepath: ./docs/dockerhub-overview.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            ```
            docker pull ${{ env.IMAGE }}:${{ github.ref_name }}
            ```

            Digest: `${{ steps.build.outputs.digest }}`
            Platforms: `linux/amd64`, `linux/arm64`
